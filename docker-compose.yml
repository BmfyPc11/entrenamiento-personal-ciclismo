version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ciclismo-db
    environment:
      POSTGRES_USER: ciclismo_user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: ciclismo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciclismo_user"]
      interval: 10s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    container_name: ciclismo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data: